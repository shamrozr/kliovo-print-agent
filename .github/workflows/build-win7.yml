name: Build Windows 7 Legacy

# Publishing requires manual dispatch and an existing legacy draft release.
on:
  workflow_dispatch:
    inputs:
      upload_to_draft:
        description: Upload verified installers to their existing Win7 draft release
        type: boolean
        default: false
  push:
    branches: [codex/windows7-legacy-release]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install build tools without mainline native modules
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check application tests
        run: pnpm test
      - name: Check legacy isolation
        run: pnpm test:win7
      - name: Package and smoke test Windows 7 installer
        run: pnpm dist:win7 --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kliovo-print-agent-win7-${{ matrix.arch }}
          path: release/win7/${{ matrix.arch }}/Kliovo-Print-Agent-Win7-*-Setup.exe
          if-no-files-found: error

  upload-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kliovo-print-agent-win7-*
          path: installers
          merge-multiple: true
      - name: Upload both verified installers to the legacy draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./legacy/win7/package.json').version")
          tag="win7-v${version}"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          test "$draft" = true
          cd installers
          sha256sum *-Setup.exe > SHA256SUMS.txt
          gh release upload "$tag" *-Setup.exe SHA256SUMS.txt --clobber
