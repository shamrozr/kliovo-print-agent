appId: com.kliovo.print-agent
productName: Kliovo Print Agent
copyright: Copyright 2026 Kliovo

directories:
  output: release

files:
  - dist/**/*
  - src/windows/settings/index.html
  - src/windows/settings/renderer.js
  - assets/**/*
  - package.json
  - node_modules/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Kliovo Print Agent

mac:
  # zip (not dmg) — dmgbuild flakes on hosted runners (missing background.tiff /
  # hdiutil detach), and zip is what electron-updater needs for macOS auto-update.
  # Users unzip and drag Kliovo Print Agent.app to Applications.
  target:
    - target: zip
      arch: [x64, arm64]
  icon: assets/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: Kliovo Print Agent
  background: ~

publish:
  provider: github
  owner: shamrozr
  repo: kliovo-print-agent
  # PRERELEASE for the 2.12.0 drawer pilot.
  #
  # This is the field kill-switch, and it is load-bearing. The catalog sync
  # (app-release.service) reads /releases/latest, which EXCLUDES prereleases,
  # and maps prerelease -> channel "beta"; /api/print-agent/update serves
  # channel "stable" ONLY. So a prerelease is downloadable by hand and reaches
  # NO live agent automatically.
  #
  # Flip back to `release` (or promote the GitHub release from prerelease to
  # latest) once a real drawer has been opened on a pilot till and normal
  # printing is confirmed unaffected. The fleet then follows within the hour.
  releaseType: prerelease
